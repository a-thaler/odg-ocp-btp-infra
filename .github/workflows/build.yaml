name: Build and publish OCI artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Bare semver, no leading 'v' (0.7.0 or 0.7.0-rc.1)
        required: true
        type: string
      publish:
        description: Push images and charts to the registry and create attestations
        required: false
        type: boolean
        default: true
    outputs:
      chart-digest:
        description: Digest of the published odg-infra Helm chart
        value: ${{ jobs.helm-chart.outputs.chart-digest }}

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  helm-chart:
    name: Build Helm chart
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    outputs:
      chart-digest: ${{ steps.push.outputs.chart-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.18.4
      - name: Install Cosign
        if: inputs.publish
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          helm package charts/odg-infra --version "${VERSION}" --app-version "${VERSION}"
      - name: Push chart
        if: inputs.publish
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          OWNER="${OWNER,,}"

          # helm push writes "Pushed:"/"Digest:" to stderr, so capture both streams.
          output=$(helm push odg-infra-${VERSION}.tgz \
            oci://$REGISTRY/$OWNER/odg/charts 2>&1)
          echo "${output}"

          digest=$(echo "${output}" | awk '/^Digest:/ {print $2}')
          if [ -z "${digest}" ]; then
            echo "::error::could not parse chart digest from helm push output"
            exit 1
          fi

          echo "chart-digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "CHART_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "OWNER=$OWNER" >> "$GITHUB_ENV"
      - name: Sign chart (cosign key)
        if: inputs.publish
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Write the key to a file; env:// can mangle multi-line PEM on the runner.
          printf '%s\n' "${COSIGN_KEY}" > /tmp/cosign.key
          head -1 /tmp/cosign.key | grep -q 'BEGIN' || { echo "::error::COSIGN_KEY secret is not valid PEM"; exit 1; }
          cosign sign --yes --key /tmp/cosign.key \
            "${REGISTRY}/${OWNER}/odg/charts/odg-infra@${CHART_DIGEST}"
          rm -f /tmp/cosign.key
      - name: Attest Helm chart
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ env.CHART_DIGEST }}
          subject-name: ${{ env.REGISTRY }}/${{ env.OWNER }}/odg/charts/odg-infra
