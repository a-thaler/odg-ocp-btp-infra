{{- if .Values.auditlog.enabled }}
apiVersion: security.btp.sap.crossplane.io/v1alpha1
kind: SubaccountApiCredential
metadata:
  name: {{ .Values.subaccount.name }}-xsuaa-credentials
spec:
  forProvider:
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
  writeConnectionSecretToRef:
    name: {{ .Values.subaccount.name }}-xsuaa-credentials
    namespace: {{ .Values.secrets.outputNamespace }}
---
apiVersion: security.btp.sap.crossplane.io/v1alpha1
kind: RoleCollection
metadata:
  name: {{ .Values.subaccount.name }}-auditlog-viewer
spec:
  forProvider:
    name: {{ .Values.auditlog.roleCollectionName | quote }}
    description: "View SAP Audit Log Service logs"
    roles:
      {{- range .Values.auditlog.roleCollectionRoles }}
      - name: {{ .name | quote }}
        roleTemplateAppId: {{ .roleTemplateAppId | quote }}
        roleTemplateName: {{ .roleTemplateName | quote }}
      {{- end }}
  subaccountApiCredentialRef:
    name: {{ .Values.subaccount.name }}-xsuaa-credentials
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
{{- range .Values.auditlog.viewers }}
---
apiVersion: security.btp.sap.crossplane.io/v1alpha1
kind: RoleCollectionAssignment
metadata:
  name: auditlog-viewer-{{ .name }}
spec:
  forProvider:
    roleCollectionName: {{ $.Values.auditlog.roleCollectionName | quote }}
    userName: {{ .email }}
    origin: {{ $.Values.idp.origin }}
  subaccountApiCredentialRef:
    name: {{ $.Values.subaccount.name }}-xsuaa-credentials
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" $ }}
{{- end }}
{{- end }}
