{{- if .Values.cloudLogging.enabled }}
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceInstance
metadata:
  name: cloud-logging
spec:
  forProvider:
    name: cloud-logging
    offeringName: cloud-logging
    planName: standard
    shared: true
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" . }}
    serviceManagerRef:
      name: {{ .Values.subaccount.name }}
    parameters:
      esApiEnabled: false
      ingest_otlp:
        enabled: true
      maxDataInstances: {{ .Values.cloudLogging.maxDataInstances }}
      maxIngestInstances: {{ .Values.cloudLogging.maxIngestInstances }}
      retentionPeriod: {{ .Values.cloudLogging.retentionPeriod }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceBinding
metadata:
  name: cloud-logging-binding
spec:
  forProvider:
    name: cloud-logging-binding
    serviceInstanceRef:
      name: cloud-logging
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
  writeConnectionSecretToRef:
    name: cloud-logging-credentials
    namespace: {{ .Values.secrets.outputNamespace }}
{{- end }}
