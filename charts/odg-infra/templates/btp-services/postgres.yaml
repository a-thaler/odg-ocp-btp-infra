{{- if .Values.postgres.enabled }}
{{- $root := . }}
{{- $pg := .Values.postgres }}
{{- $shoots := .Values.shoots }}
{{- if not $shoots }}
{{- fail "postgres.enabled is true but shoots is empty; entitlements are sized per shoot" }}
{{- end }}
{{- $count := len $shoots }}
# PostgreSQL (SCI regions) requires TWO entitlements per the SAP sizing table: the compute
# SKU (the chosen plan, standard/premium) and a separate storage SKU. Units are counted per
# INSTANCE, not by disk GB (disk is an in-instance parameter in 5GB blocks). Compute units
# scale with RAM: standard = memory/2 per instance (2GB->1, 4GB->2); multi-AZ doubles the
# compute SKU and switches the storage SKU to storage_ha. Storage SKU is 1 per instance.
{{- $computeMultiplier := ternary 2 1 $pg.multiAz }}
{{- $computePerInstance := div $pg.memory 2 }}
{{- $computeAmount := mul $count $computePerInstance $computeMultiplier }}
{{- $storagePlan := ternary "storage_ha" "storage" $pg.multiAz }}
{{- $storageAmount := $count }}
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Entitlement
metadata:
  name: {{ .Values.subaccount.name }}-postgresql-db-compute
spec:
  forProvider:
    serviceName: postgresql-db
    servicePlanName: {{ $pg.plan | quote }}
    amount: {{ $computeAmount }}
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Entitlement
metadata:
  name: {{ .Values.subaccount.name }}-postgresql-db-storage
spec:
  forProvider:
    serviceName: postgresql-db
    servicePlanName: {{ $storagePlan | quote }}
    amount: {{ $storageAmount }}
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" . }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" . }}
{{- if $pg.createInstances }}
{{- range $shoots }}
{{- $shoot := . }}
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceInstance
metadata:
  name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}
spec:
  forProvider:
    name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}
    offeringName: postgresql-db
    planName: {{ $pg.plan | quote }}
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" $root }}
    serviceManagerRef:
      name: {{ $root.Values.subaccount.name }}
    parameters:
      memory: {{ $pg.memory }}
      storage: {{ $pg.storageGB }}
      engine_version: {{ $pg.engineVersion | quote }}
      multi_az: {{ $pg.multiAz }}
      backup_retention_period: {{ $pg.backupRetentionDays }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" $root }}
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceBinding
metadata:
  name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}-binding
spec:
  forProvider:
    name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}-binding
    serviceInstanceRef:
      name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}
    subaccountRef:
      name: {{ include "odg-infra.subaccountRef" $root }}
  providerConfigRef:
    name: {{ include "odg-infra.providerConfigName" $root }}
  writeConnectionSecretToRef:
    name: {{ $pg.bindingPrefix }}-{{ $shoot.name }}-credentials
    namespace: {{ $root.Values.secrets.outputNamespace }}
{{- end }}
{{- end }}
{{- end }}
