# SAP Cloud Logging Service Instance and Binding
#
# Provides centralized logging for applications and infrastructure.
# The binding creates a secret with credentials for log ingestion.
#
# Parameters:
#   - esApiEnabled: false (OpenSearch API disabled)
#   - ingest_otlp.enabled: true (OpenTelemetry ingestion enabled)
#   - retentionPeriod: 30 days
#
# The cloud-logging-credentials secret contains the endpoint URL and auth
# for configuring log shipping from Gardener shoots.
#
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceInstance
metadata:
  name: cloud-logging
spec:
  forProvider:
    name: cloud-logging
    offeringName: cloud-logging
    planName: standard
    shared: true
    subaccountRef:
      name: odg
    serviceManagerRef:
      name: odg
    parameters:
      esApiEnabled: false
      ingest_otlp:
        enabled: true
      maxDataInstances: 10
      maxIngestInstances: 10
      retentionPeriod: 30
  providerConfigRef:
    name: account-provider-config
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceBinding
metadata:
  name: cloud-logging-binding
spec:
  forProvider:
    name: cloud-logging-binding
    serviceInstanceRef:
      name: cloud-logging
    subaccountRef:
      name: odg
  providerConfigRef:
    name: account-provider-config
  writeConnectionSecretToRef:
    name: cloud-logging-credentials
    namespace: default
