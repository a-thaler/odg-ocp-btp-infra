# BTP Service Entitlements
#
# Entitlements for BTP services used by the infrastructure.
#   - cloud-logging: Centralized logging service
#
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Entitlement
metadata:
  name: odg-cloud-logging
spec:
  forProvider:
    serviceName: cloud-logging
    servicePlanName: standard
    amount: 1
    subaccountRef:
      name: odg
  providerConfigRef:
    name: account-provider-config
