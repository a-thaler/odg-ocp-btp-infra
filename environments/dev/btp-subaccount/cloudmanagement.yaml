# BTP Cloud Management (CIS)
#
# Required for BTP subscriptions (like auditlog-viewer).
# Creates a connection secret with Cloud Management credentials.
#
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: CloudManagement
metadata:
  name: odg # should be changed for new accounts
spec:
  writeConnectionSecretToRef:
    name: odg-cloud-management
    namespace: default
  forProvider:
    serviceManagerRef:
      name: odg
    subaccountRef:
      name: odg
  providerConfigRef:
    name: account-provider-config
