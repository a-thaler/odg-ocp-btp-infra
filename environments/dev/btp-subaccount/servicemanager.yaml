# BTP Service Manager
#
# Required for provisioning BTP service instances.
# Creates a connection secret with Service Manager credentials.
#
---
apiVersion: account.btp.sap.crossplane.io/v1beta1
kind: ServiceManager
metadata:
  name: odg
spec:
  writeConnectionSecretToRef:
    name: odg-service-manager
    namespace: default
  forProvider:
    subaccountRef:
      name: odg
  providerConfigRef:
    name: account-provider-config
