# BTP Subaccount (pre-existing)
#
# This subaccount was created manually and is adopted by Crossplane.
# The external-name annotation contains the subaccount GUID (also used as tenantID for audit logging).
#
# Note: subaccountAdmins can only be set at creation time, not updated.
# Additional admins must be added via BTP Cockpit > Security > Users.
#
---
apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Subaccount
metadata:
  name: odg
  annotations:
    crossplane.io/external-name: 73a5482f-6be1-4253-976e-32b1dbccc9b9
spec:
  deletionPolicy: Orphan # ws pre-exising subaccount, so never delete it
  forProvider:
    displayName: infra-odg-dev-sap
    subdomain: infra-odg-dev-sap
    region: eu10-canary
    subaccountAdmins:
      - andreas.thaler01@sap.com
    # Additional admins must be added via BTP Cockpit (can't be updated via provider)
    # - alexander.bassmanow@sap.com
    # - j.brand@sap.com
    # - chris.schneider02@sap.com
    # - jakob.moeller@sap.com
    # - fabian.burth@sap.com
    # - frederic.wilhelm@sap.com
    # - johannes.neisener@sap.com
    # - gerald.morrison@sap.com
  providerConfigRef:
    name: account-provider-config
