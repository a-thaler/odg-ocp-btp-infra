# Inject Audit Log Credentials into Gardener Namespace
#
# This Object creates the auditlog credentials secret in the Gardener project namespace
# by referencing the BTP ServiceBinding connection secret.
#
# Note: This requires the auditlog-credentials secret to exist first (from BTP ServiceBinding).
# The secret format from BTP is typically: url, user, password
# Gardener expects: user, password
#
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: gardener-auditlog-credentials
spec:
  providerConfigRef:
    name: gardener
  # Reference the source secret for credential injection
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: auditlog-credentials
        namespace: default
        fieldPath: data.user
      toFieldPath: data.user
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: auditlog-credentials
        namespace: default
        fieldPath: data.password
      toFieldPath: data.password
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: shoot-dummy-auditlog-credentials
        namespace: garden-odgdev
      type: Opaque
      data:
        user: ""      # Patched from reference
        password: ""  # Patched from reference
