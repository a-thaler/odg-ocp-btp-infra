# Kubernetes Provider Config for Gardener API
#
# This ProviderConfig allows the Crossplane Kubernetes provider to create
# resources (like Shoots) on the Gardener API server.
#
# The referenced secret contains a kubeconfig with a service account token
# for the garden-odgdev namespace.
#
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: gardener
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: default
      name: gardener-kubeconfig
      key: kubeconfig
