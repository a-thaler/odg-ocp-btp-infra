# Cloud Logging Namespace in Shoot Dummy
#
# Creates the namespace where Cloud Logging credentials and collector will live.
#
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: shoot-dummy-cloud-logging-namespace
spec:
  providerConfigRef:
    name: shoot-dummy
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cloud-logging
        labels:
          app.kubernetes.io/name: cloud-logging
          app.kubernetes.io/managed-by: crossplane
