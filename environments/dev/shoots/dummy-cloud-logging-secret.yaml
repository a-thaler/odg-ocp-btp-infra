# Inject Cloud Logging Credentials into Shoot Dummy
#
# Creates a Secret in the shoot cluster containing Cloud Logging credentials.
# Applications can use this to configure log shipping via OpenTelemetry.
#
# The secret is created in the 'cloud-logging' namespace.
# Contains:
#   - ingest-otlp-endpoint: OTLP endpoint URL
#   - ingest-otlp-cert: Client certificate for mTLS
#   - ingest-otlp-key: Client key for mTLS
#   - server-ca: CA certificate for TLS verification
#
# Dependencies:
#   - ServiceBinding cloud-logging-shoot-dummy must be READY
#   - ProviderConfig shoot-dummy must be configured with shoot kubeconfig
#   - Namespace cloud-logging must exist in the shoot
#
---
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: shoot-dummy-cloud-logging-credentials
spec:
  providerConfigRef:
    name: shoot-dummy
  references:
    # Inject OTLP endpoint
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: cloud-logging-shoot-dummy-credentials
        namespace: default
        fieldPath: data.ingest-otlp-endpoint
      toFieldPath: data.ingest-otlp-endpoint
    # Inject client certificate
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: cloud-logging-shoot-dummy-credentials
        namespace: default
        fieldPath: data.ingest-otlp-cert
      toFieldPath: data.ingest-otlp-cert
    # Inject client key
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: cloud-logging-shoot-dummy-credentials
        namespace: default
        fieldPath: data.ingest-otlp-key
      toFieldPath: data.ingest-otlp-key
    # Inject server CA
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: cloud-logging-shoot-dummy-credentials
        namespace: default
        fieldPath: data.server-ca
      toFieldPath: data.server-ca
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloud-logging-credentials
        namespace: cloud-logging
        labels:
          app.kubernetes.io/name: cloud-logging
          app.kubernetes.io/managed-by: crossplane
      type: Opaque
      data:
        # Values injected from references above
        ingest-otlp-endpoint: ""
        ingest-otlp-cert: ""
        ingest-otlp-key: ""
        server-ca: ""
