# Example landscape override for the odg-infra chart.
#
# Copy this file, fill in your subaccount/landscape values, and supply it to the
# HelmRelease as the `odg-infra-values` ConfigMap (see README "Prerequisites").
# It overrides the defaults in charts/odg-infra/values.yaml. Keep your real copy
# OUT of git.

btp:
  cliServerUrl: "https://canary.cli.btp.int.sap"   # BTP CLI server for your region
  globalAccountId: "<global-account-guid>"

subaccount:
  name: "odg"
  guid: "<subaccount-guid>"                         # also used as auditlog tenantID
  displayName: "<subaccount-display-name>"
  subdomain: "<subaccount-subdomain>"
  region: "eu10-canary"
  admins:
    - first.last@example.com

gardener:
  gardenNamespace: "<garden-namespace>"             # e.g. garden-odgdev

auditlog:
  serviceUrl: "<service-url>"
  # Users assigned to the "Auditlog Viewer" collection (one assignment each).
  viewers:
    - name: first-last
      email: first.last@example.com

# Cloud Logging OpenSearch Dashboards SSO via IAS SAML 2.0 (OPTION 2, no request signing).
# The IAS tenant and SAML application are configured manually (see README). No secret is
# involved, all fields below are non-secret and live in this ConfigMap override.
cloudLogging:
  saml:
    enabled: true
    initiated: true
    roles_key: "groups"
    admin_group: "CLS_Admin"
    idp:
      metadata_url: "<ias-service-url>/saml2/metadata"
      entity_id: "cls"
    sp:
      entity_id: "<saml-app-entity-id>"

shoots:
  - name: dev-1

# Shoot defaults for this landscape.
shootDefaults:
  kubernetes:
    version: "1.36.5"
  region: "eu-de-1"
  cloudProfile: "<cloud-profile>"
  credentialsBindingName: "<credentials-binding-name>"
  zones:
    - "<zone>"
  worker:
    machineType: "<machine-type>"
    image:
      name: "gardenlinux"
      version: "2150.15.0"
    min: 1
    max: 2
  purpose: "evaluation"
