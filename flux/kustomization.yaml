apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system

# Committed Flux resources for the ODG control plane.
# The landscape values Secret (odg-infra-values) and the GHCR pull secret
# (ghcr-pull) are applied separately and are NOT part of this kustomization,
# because they carry landscape-specific / credential data.
resources:
  - ocirepository.yaml
  - helmrelease.yaml
