apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: odg-infra
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/a-thaler/odg/charts/odg-infra
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    # Pin to a published chart version. Update on each release.
    tag: "0.1.0-1795699658"
  # GHCR package is private -> Flux needs a pull secret (see README / secrets).
  # Delete this block if you make the package public.
  secretRef:
    name: ghcr-pull
  # Verify the cosign key-based signature produced by the publish workflow.
  # Key-based (not keyless) so it works on the managed read-only source-controller:
  # it checks the public key in the cosign-pub secret, no Sigstore TUF / writable HOME.
  verify:
    provider: cosign
    secretRef:
      name: cosign-pub
